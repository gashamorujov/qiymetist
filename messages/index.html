<!DOCTYPE html>
<html lang="az" data-mode="winter">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs və İmtahan Mesajları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="messages.css">
<script>try{var m=localStorage.getItem('ist_mode_v2');if(/^(normal|winter|snow|dark|cyber|micro)$/.test(m))document.documentElement.setAttribute('data-mode',m);}catch(e){}</script>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabMessages" data-tab="messages" role="tab">Mesajlar</button>
      <button class="tab" id="tabExams" data-tab="exams" role="tab">İmtahanlar</button>
      <button class="tab" id="tabMixed" data-tab="mixed" role="tab">Qarışıq</button>
    </div>
  </div>
</header>

<div class="main">
  <section class="section active" id="sec-messages">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="q-messages" placeholder="Kurs adı və ya kodu — məsələn SK, SL" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="meta-line"><span data-count="messages"></span></div>
    <div class="list" id="list-messages"></div>
  </section>
  <section class="section" id="sec-exams">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="q-exams" placeholder="Kurs adı və ya kodu — məsələn SK, SL" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="meta-line"><span data-count="exams"></span></div>
    <div class="list" id="list-exams"></div>
  </section>
  <section class="section" id="sec-mixed">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="q-mixed" placeholder="Mesaj axtar..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="meta-line"><span data-count="mixed"></span></div>
    <div class="list" id="list-mixed"></div>
  </section>
</div>

<!-- Mesaj pəncərəsi -->
<div class="scrim modal" id="modal">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog-head"><h2 class="modal-title" id="modalTitle"></h2>
      <button class="icon-btn" type="button" id="modalClose" aria-label="Bağla"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="dialog-body" id="modalBody"></div>
    <div class="dialog-foot"><button class="btn btn-primary btn-copy" type="button" id="copyBtn">KOPYALA</button></div>
  </div>
</div>

<!-- Ümumi təsdiq / mətn pəncərəsi -->
<div class="scrim" id="dlg" style="z-index:9650">
  <div class="dialog" style="max-width:420px" role="dialog" aria-modal="true">
    <div class="dialog-head"><h2 id="dlgTitle"></h2></div>
    <div class="dialog-body"><p id="dlgText" style="margin:0;color:var(--mute)"></p><input class="field" id="dlgInput" style="margin-top:12px" hidden></div>
    <div class="dialog-foot"><button class="btn btn-ghost" type="button" id="dlgNo">Ləğv et</button><button class="btn btn-primary" type="button" id="dlgYes">Təsdiqlə</button></div>
  </div>
</div>

<!-- İdarəetmə paneli (axtarışa 1006 yazdıqda) -->
<div class="admin" id="admin">
  <div class="admin-head">
    <h2>Mesajların idarəsi<small>Təsdiqlənən dəyişiklik hamıda real vaxtda yenilənir</small></h2>
    <button class="btn" type="button" id="adminExit">Çıxış</button>
  </div>
  <div class="admin-body">
    <div class="view active" id="v-main"><div class="cats" id="cats"></div></div>
    <div class="view" id="v-list">
      <div class="crumbs"><button class="icon-btn" type="button" id="listBack" aria-label="Geri">←</button><h3 id="listTitle"></h3><span id="listTools"></span></div>
      <div class="rows" id="rows"></div>
      <button class="add-dash" type="button" id="addItem">+ Əlavə et</button>
    </div>
    <div class="view" id="v-form">
      <div class="crumbs"><button class="icon-btn" type="button" id="formBack" aria-label="Geri">←</button><h3 id="formTitle"></h3></div>
      <div class="form" id="form"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span class="ti"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span><span id="toastText"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../assets/firebase.js"></script>
<script src="../snow.js"></script>
<script src="../assets/theme.js"></script>
<script src="defaults.js"></script>
<script src="messages.js"></script>
</body>
</html>
